services:
  db:
    image: postgres:16
    container_name: ibms-postgres
    environment:
      POSTGRES_DB: ibms
      POSTGRES_USER: ibms
      POSTGRES_PASSWORD: ibms
    ports:
      - "5432:5432"
    volumes:
      - ibms-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibms -d ibms"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: ibms-backend
    # Flyway migrates at startup, so the app must not boot before Postgres is
    # accepting connections — hence the healthcheck condition rather than a bare
    # depends_on, which only waits for the container to start.
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Host-side mapping only. APP_PORT below is the port the process binds.
      - "${APP_HOST_PORT:-8080}:8080"
    environment:
      # This compose file is for local/dev use, so it opts into the relaxed rules.
      # A real deployment sets APP_ENV=prod and must then supply a strong JWT_SECRET,
      # a real DB_PASSWORD, an explicit CORS_ALLOWED_HOSTS and an https APP_URL, or
      # the app refuses to start.
      APP_ENV: ${APP_ENV:-dev}
      APP_PORT: 8080
      # `db` is the service's DNS name on the compose network. Not localhost:
      # inside this container that resolves to the app itself.
      DB_URL: jdbc:postgresql://db:5432/ibms
      DB_USER: ibms
      DB_PASSWORD: ibms
      JWT_SECRET: ${JWT_SECRET:-local-docker-testing-secret-not-for-any-shared-host}
      # Named volume below, so uploads survive a rebuild.
      STORAGE_LOCAL_DIR: /app/storage
      CORS_ALLOWED_HOSTS: ${CORS_ALLOWED_HOSTS:-}
      APP_URL: ${APP_URL:-http://localhost:8080}
      # Only consulted on the first boot against an empty database; a no-op once
      # the sysadmin has a password. Blank here means a password is generated and
      # logged exactly once, because AUTOGENERATE defaults on in a dev environment.
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-mikepg}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # Outbound email. This block is an explicit allowlist, not env_file — anything
      # missing here is simply absent inside the container. `log` means notifications
      # are logged rather than sent; `smtp` requires SMTP_HOST below.
      EMAIL_DELIVERY: ${EMAIL_DELIVERY:-log}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-IBMS Notifications}
      # generate-rfp / release-to-finance / pay / the cheque exports. Off by default:
      # the topsheet lifecycle ends at COMPILED and the deliverable is the xlsx export.
      # Listed here because this block is an allowlist — without the line, compose has
      # no way to flip it.
      TOPSHEET_RFP_FLOW_ENABLED: ${TOPSHEET_RFP_FLOW_ENABLED:-false}
    volumes:
      - ibms-storage:/app/storage

volumes:
  ibms-pgdata:
  ibms-storage:
